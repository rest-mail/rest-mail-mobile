version: "3"

# The everyday commands for this repo, run with `chore <name>`.

tasks:
  get:
    desc: Fetch dependencies for the app and its two packages
    cmds:
      - flutter pub get
      - cd packages/restmail_api && dart pub get
      - cd packages/restmail_fake && dart pub get

  check:
    desc: Format check, analyze and test everything, as CI does
    cmds:
      - dart format --output=none --set-exit-if-changed lib test tool packages
      - flutter analyze
      - flutter test
      - cd packages/restmail_api && dart analyze --fatal-infos && dart test
      - cd packages/restmail_fake && dart analyze --fatal-infos && dart test

  screens:
    desc: Draw every screen, light and dark, against the fake server into build/screens
    cmds:
      - flutter test --update-goldens tool/screens/screens_test.dart
      - echo "Pictures in build/screens"

  sim:sample:
    desc: "Build the app on the fake server and start it in the iOS simulator, no terminal left attached. SCENARIO=sample|empty|twoFactor"
    vars:
      SCENARIO: '{{.SCENARIO | default "sample"}}'
    cmds:
      # Boot the first available iPhone unless a simulator is already up.
      - xcrun simctl list devices booted | grep -q Booted || xcrun simctl boot "$(xcrun simctl list devices available | grep -m1 -oE 'iPhone [^(]+' | sed 's/ *$//')"
      - open -a Simulator
      - flutter build ios --simulator --debug --dart-define=RESTMAIL_FAKE={{.SCENARIO}}
      - xcrun simctl terminate booted com.antimatterstudios.restmail 2>/dev/null || true
      - xcrun simctl install booted build/ios/iphonesimulator/Runner.app
      - xcrun simctl launch booted com.antimatterstudios.restmail

  sim:local:
    desc: "Build a debug app that trusts ddt's local CA and start it in the iOS simulator, for a rest-mail stack running behind ddt (server: https://restmail.localhost)"
    cmds:
      # The debug build pins ddt's CA (RESTMAIL_DEV_CA) instead of the Mac or the
      # simulator trusting it, so the app still verifies every certificate it is shown.
      - mkdir -p .dev
      - |
        python3 -c 'import json,sys; print(json.dumps({"RESTMAIL_DEV_CA": open(sys.argv[1]).read()}))' "$(ddt ca path)" > .dev/ddt.json
      - xcrun simctl list devices booted | grep -q Booted || xcrun simctl boot "$(xcrun simctl list devices available | grep -m1 -oE 'iPhone [^(]+' | sed 's/ *$//')"
      - open -a Simulator
      - flutter build ios --simulator --debug --dart-define-from-file=.dev/ddt.json
      - xcrun simctl terminate booted com.antimatterstudios.restmail 2>/dev/null || true
      - xcrun simctl install booted build/ios/iphonesimulator/Runner.app
      - xcrun simctl launch booted com.antimatterstudios.restmail

  ipa:
    desc: "Build the App Store Connect upload into build/ios/ipa, numbered by the commits on HEAD"
    vars:
      # Only ever goes up on main, where every merge is one squashed commit, and
      # stays under Android's versionCode ceiling should the bundle use it too.
      BUILD_NUMBER:
        sh: git rev-list --count HEAD
      # The same rule as a release: pubspec.yaml's MAJOR.MINOR, the build count
      # as the patch.
      SERIES:
        sh: awk '/^version:/ { split($2, v, "."); print v[1] "." v[2]; exit }' pubspec.yaml
      VERSION: "{{.SERIES}}.{{.BUILD_NUMBER}}"
    cmds:
      - 'git diff --quiet HEAD || { echo "Commit first: the build number names a commit, and this tree has changes on top of it" >&2; exit 1; }'
      - flutter build ipa --release --export-options-plist=ios/ExportOptions.plist --build-name={{.VERSION}} --build-number={{.BUILD_NUMBER}}
      - echo "{{.VERSION}} ({{.BUILD_NUMBER}}) in build/ios/ipa. Upload it with Transporter, or xcrun altool."

  # release-on-merge.yml makes this same tag after every merge into main, so
  # this is for a commit that did not get one. Should both run, whichever is
  # second finds the tag there and stops.
  release:
    desc: "Release main to TestFlight by hand (merges release themselves): tags it vMAJOR.MINOR.<build count>, from pubspec.yaml's MAJOR.MINOR"
    vars:
      SERIES:
        sh: awk '/^version:/ { split($2, v, "."); print v[1] "." v[2]; exit }' pubspec.yaml
      BUILD_NUMBER:
        sh: git rev-list --count HEAD
      VERSION: "{{.SERIES}}.{{.BUILD_NUMBER}}"
    cmds:
      # Checks first: a failing command ends the task before anything is tagged.
      - 'git diff --quiet HEAD || { echo "Commit first: a release names a commit, and this tree has changes on top of it" >&2; exit 1; }'
      - 'git fetch -q origin main && test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)" || { echo "Release what is on main: check out main and pull, so HEAD is origin/main" >&2; exit 1; }'
      - 'test -z "$(git tag -l v{{.VERSION}})" || { echo "v{{.VERSION}} is released already: nothing has been merged since" >&2; exit 1; }'
      - git tag -a v{{.VERSION}} -m "rest-mail {{.VERSION}}"
      - git push origin v{{.VERSION}}
      - echo "Tagged v{{.VERSION}}. testflight.yml builds it as {{.VERSION}} ({{.BUILD_NUMBER}}); follow it with gh run watch."

  run:sample:
    desc: "Run the app on the fake server, no rest-mail needed. SCENARIO=sample|empty|twoFactor"
    vars:
      SCENARIO: '{{.SCENARIO | default "sample"}}'
    cmds:
      - flutter run --dart-define=RESTMAIL_FAKE={{.SCENARIO}}
