name: restmail_fake
description: An in-memory rest-mail server, for tests and for running the app with no server.
version: 0.1.0
publish_to: none

environment:
  sdk: ^3.9.0

dependencies:
  # Already used by the app; parse certificate metadata in the HTTP fake.
  basic_utils: ^5.8.2
  http: ^1.6.0

dev_dependencies:
  # The tests drive the fake through the real client.
  restmail_api:
    path: ../restmail_api
  lints: ^6.1.0
  test: ^1.31.1
