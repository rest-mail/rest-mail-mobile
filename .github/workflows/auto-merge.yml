name: Auto-merge

# Every pull request into main is set to squash-merge itself once the checks
# that protect main have passed. This only asks for the merge; branch
# protection decides when, so nothing merges on red.
#
# The merge is armed with a personal access token rather than this workflow's
# own GITHUB_TOKEN, because GitHub starts no workflow run for an event that
# GITHUB_TOKEN caused. Armed that way, a merge into main reached nothing: no
# CI, and no TestFlight build. The token makes the merge an ordinary push, so
# the workflows watching main run.
#
# Pull requests cannot reach the token. It lives in the `automerge`
# environment, which only main may use, and this runs on pull_request_target:
# GitHub runs main's copy of this file, not the pull request's, so a pull
# request cannot rewrite the step below to print the token. Under plain
# pull_request it ran the branch's copy, with the token in reach of any branch
# pushed here. Nothing here checks out or runs the pull request's code, which
# is what keeps pull_request_target safe; keep it that way.
#
# PIPELINE_RESTMAIL_TOKEN expires 2026-11-09, the 30-day default for a new
# fine-grained token, and holds Contents, Pull requests and Workflows on this
# repository alone. Past that date the step below fails to authenticate and
# nothing merges — a failure that reads as "auto-merge stopped working" with
# nothing naming a credential, which is why the date is written here rather
# than left to be rediscovered. Re-issue it and set the secret again.
on:
  pull_request_target:
    # `edited` covers a stacked pull request retargeted to main after the one
    # beneath it merges.
    types: [opened, reopened, synchronize, ready_for_review, edited]

# Nothing here uses GITHUB_TOKEN, so it is given nothing.
permissions: {}

jobs:
  arm:
    name: Arm auto-merge
    # This repository's own branches, into main, and never a draft. Under
    # pull_request_target a fork's pull request runs with secrets too, so the
    # first line is what keeps a stranger from arming a merge. It is read from
    # main's copy of this file, which a pull request cannot change.
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.base.ref == github.event.repository.default_branch &&
      !github.event.pull_request.draft
    runs-on: ubuntu-latest
    environment: automerge
    steps:
      - run: gh pr merge --auto --squash "$PR"
        env:
          GH_TOKEN: ${{ secrets.PIPELINE_RESTMAIL_TOKEN }}
          PR: ${{ github.event.pull_request.html_url }}
