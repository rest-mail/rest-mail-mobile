name: Auto-merge

# Every pull request into main is set to squash-merge itself once the checks
# that protect main have passed. This only asks for the merge; branch
# protection decides when, so nothing merges on red.
on:
  pull_request:
    # `edited` covers a stacked pull request retargeted to main after the one
    # beneath it merges.
    types: [opened, reopened, synchronize, ready_for_review, edited]

permissions:
  contents: write
  pull-requests: write

jobs:
  arm:
    name: Arm auto-merge
    # This repository's own branches, into main, and never a draft. A pull
    # request from a fork gets a read-only token and could not arm it anyway.
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.base.ref == github.event.repository.default_branch &&
      !github.event.pull_request.draft
    runs-on: ubuntu-latest
    steps:
      - run: gh pr merge --auto --squash "$PR"
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.html_url }}
