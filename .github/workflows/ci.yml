name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # The version the code is written and checked against. Bump it on purpose,
  # not by drifting onto whatever "stable" means this week.
  FLUTTER_VERSION: "3.47.1"

jobs:
  api-client:
    name: API client
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/restmail_api
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: dart pub get
      - run: dart format --output=none --set-exit-if-changed .
      - run: dart analyze --fatal-infos
      - run: dart test

  fake-server:
    name: Fake server
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/restmail_fake
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: dart pub get
      - run: dart format --output=none --set-exit-if-changed .
      - run: dart analyze --fatal-infos
      - run: dart test

  app:
    name: App
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed lib test tool
      - run: flutter analyze
      - run: flutter test
      # The screen tour against the fake. It passes or fails only on whether
      # every screen can still be reached; the pictures ride along with each
      # run for anyone reviewing the change.
      - run: flutter test --update-goldens tool/screens/screens_test.dart
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: screens
          path: build/screens/
          retention-days: 14

  # IMAP and SMTP accounts against a real mail server: GreenMail, over
  # IMAPS and SMTPS. The rest of the IMAP tests replay recorded responses.
  imap:
    name: IMAP against GreenMail
    runs-on: ubuntu-latest
    services:
      greenmail:
        image: greenmail/standalone:2.1.3
        env:
          GREENMAIL_OPTS: >-
            -Dgreenmail.setup.test.all
            -Dgreenmail.hostname=0.0.0.0
            -Dgreenmail.users=ada:secret@example.test
            -Dgreenmail.users.login=email
        ports:
          - 3993:3993
          - 3465:3465
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Wait for GreenMail
        run: |
          for _ in $(seq 1 60); do
            (exec 3<>/dev/tcp/127.0.0.1/3993) 2>/dev/null && exit 0
            sleep 1
          done
          echo "::error::GreenMail did not start" >&2
          exit 1
      - run: flutter test test/imap/greenmail_test.dart
        env:
          GREENMAIL_HOST: 127.0.0.1

  android:
    name: Android build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "21"
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter build apk --debug

      # The app bundle is what Play takes, and it is built with R8 and resource
      # shrinking, so a rule missing from proguard-rules.pro fails here rather than
      # in someone's hands. Unsigned-for-upload on CI: the upload keystore is not in
      # this repository, so the debug key signs and the bundle is a build check only.
      - run: flutter build appbundle --release

      - name: Say which key signed the bundle
        run: |
          set -euo pipefail
          aab=build/app/outputs/bundle/release/app-release.aab
          test -f "$aab" || { echo "::error::no app bundle at $aab" >&2; exit 1; }
          signer=$(keytool -printcert -jarfile "$aab" | sed -n 's/^Owner: //p' | head -1)
          echo "signed by: ${signer:-unknown}"
          case "$signer" in
            *"Android Debug"*)
              echo "::notice::debug-signed: this bundle is a build check, not an upload. Play needs the upload key (android/key.properties)."
              ;;
            *)
              echo "::notice::signed with a non-debug key"
              ;;
          esac

  ios:
    name: iOS build
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      # A simulator build needs no signing identity, so it runs on any fork.
      - run: flutter build ios --simulator --debug

  # The one check branch protection requires: it passes only when every job
  # above did, so adding or renaming a job never strands a required check.
  ci:
    name: CI
    needs: [api-client, fake-server, app, imap, android, ios]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Verdict
        env:
          RESULTS: |
            api-client=${{ needs.api-client.result }}
            fake-server=${{ needs.fake-server.result }}
            app=${{ needs.app.result }}
            imap=${{ needs.imap.result }}
            android=${{ needs.android.result }}
            ios=${{ needs.ios.result }}
        run: |
          set -euo pipefail
          fail=0
          while IFS='=' read -r job result; do
            [ -n "$job" ] || continue
            printf '  %-10s %s\n' "$job" "$result"
            case "$result" in
              success | skipped) ;;
              *) fail=1 ;;
            esac
          done <<< "$RESULTS"
          if [ "$fail" = 1 ]; then
            echo "::error::a job did not succeed" >&2
            exit 1
          fi
          echo "  all jobs that ran passed"
