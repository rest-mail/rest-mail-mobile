name: Release on merge

# Every commit that lands on main is tagged as a release, so every merge
# reaches TestFlight without anyone running anything; this is the only way a
# release is made. The tag is vMAJOR.MINOR.<build count>, from pubspec.yaml's
# MAJOR.MINOR and the number of commits behind the commit. testflight.yml
# builds and uploads on that tag, and its gate (tool/ci/release_gate.sh)
# judges it.
#
# The tag is pushed with PIPELINE_RESTMAIL_TOKEN, the personal access token
# auto-merge.yml arms merges with, for the same reason: GitHub starts no
# workflow run for a push that GITHUB_TOKEN made, so a tag pushed with it would
# never start testflight.yml. The token lives in the `automerge` environment,
# which only main may use, and this runs only for pushes to main. Only the step
# that pushes the tag can see it, and nothing in this job checks out or runs
# the repository's code: the version is read out of git.
#
# No loop: pushing the tag is a push too, but a tag does not match `branches`,
# so it starts testflight.yml and not this.
on:
  push:
    branches: [main]

# One at a time, so tags go out in the order their commits landed. The gate
# refuses a tag older than the newest release, so a tag for an older commit
# pushed after a newer one would never build.
concurrency:
  group: release-on-merge
  cancel-in-progress: false

# Nothing here uses GITHUB_TOKEN, so it is given nothing.
permissions: {}

jobs:
  tag:
    name: Tag the release
    # A push Dependabot made itself (`@dependabot merge`) runs with Dependabot's
    # secrets, not this repository's, so the token is not there to push with.
    # Dependabot only moves the action pins CI runs, which change nothing in
    # the app; the next merge releases them. A person merging a Dependabot
    # pull request is an ordinary push, and releases.
    if: github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    environment: automerge
    timeout-minutes: 5
    steps:
      - name: Work out the tag
        id: tag
        env:
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          # The repository is public, so this clones with no token at all. It
          # takes git's objects and no working tree: no file of the
          # repository's is written out, let alone run.
          git clone --quiet --no-checkout --filter=blob:none \
            "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git" repo
          cd repo

          # Only the tip of main. If main has moved on, the run for the newer
          # commit tags that one, and its release has this commit in it.
          tip=$(git rev-parse origin/main)
          if [ "$tip" != "$SHA" ]; then
            echo "::notice::main has moved on to ${tip:0:7}, whose own run releases it, ${SHA:0:7} included"
            exit 0
          fi

          series=$(git show "$SHA:pubspec.yaml" |
            awk '/^version:/ { split($2, v, "."); print v[1] "." v[2]; exit }')
          [[ $series =~ ^[0-9]+\.[0-9]+$ ]] || {
            echo "::error::pubspec.yaml's version gives no MAJOR.MINOR (read '$series')" >&2
            exit 1
          }
          version="$series.$(git rev-list --count "$SHA")"
          tag="v$version"

          if git rev-parse -q --verify "refs/tags/$tag" > /dev/null; then
            echo "::notice::$tag is released already, at $(git rev-parse --short "$tag^{commit}")"
            exit 0
          fi

          git -c user.name='github-actions[bot]' \
            -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
            tag -a "$tag" -m "rest-mail $version" "$SHA"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "made $tag at ${SHA:0:7}"

      - name: Push the tag, which starts testflight.yml
        if: steps.tag.outputs.tag != ''
        working-directory: repo
        env:
          TAG: ${{ steps.tag.outputs.tag }}
          TOKEN: ${{ secrets.PIPELINE_RESTMAIL_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "$TOKEN" ]; then
            echo "::error::PIPELINE_RESTMAIL_TOKEN is not set in the automerge environment (see auto-merge.yml), so $TAG was not pushed. Set it, then re-run this job." >&2
            exit 1
          fi

          # The token reaches the push alone, through its environment: not on a
          # command line, and never written into .git/config.
          auth=$(printf 'x-access-token:%s' "$TOKEN" | base64 -w0)
          echo "::add-mask::$auth"
          if GIT_CONFIG_COUNT=1 \
            GIT_CONFIG_KEY_0="http.$GITHUB_SERVER_URL/.extraheader" \
            GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $auth" \
            git push --quiet origin "refs/tags/$TAG"; then
            echo "::notice::pushed $TAG; testflight.yml builds it"
            exit 0
          fi

          # Refused. If a re-run of this job pushed the same tag since this run
          # looked, that is the release and there is nothing left to do. The
          # last line is the commit, whether or not the tag is annotated.
          there=$(git ls-remote origin "refs/tags/$TAG" "refs/tags/$TAG^{}" | tail -1 | cut -f1)
          if [ -n "$there" ]; then
            echo "::notice::$TAG is released already, at ${there:0:7}"
            exit 0
          fi
          echo "::error::$TAG was not pushed. If the push failed to authenticate, PIPELINE_RESTMAIL_TOKEN has most likely expired (auto-merge.yml says when): re-issue it, then re-run this job." >&2
          exit 1
