name: restmail
description: rest-mail client for iOS and Android.
publish_to: 'none'

# MAJOR.MINOR of the next release. The patch is never set here: a release is
# MAJOR.MINOR.<build count>, the build count being the number of commits behind
# it, so every build has its own version and no version comes round twice.
# Raise MINOR for a release with something new in it; `chore release` tags it
# (testflight.yml). The rest of this line is what a plain `flutter run` shows.
version: 0.3.0+1

environment:
  sdk: ^3.13.1

dependencies:
  flutter:
    sdk: flutter
  # The delegates behind supportedLocales: without them a phone set to
  # German would get our strings and no Material ones.
  flutter_localizations:
    sdk: flutter

  # The REST client, kept in this repo as a plain Dart package so it has no
  # Flutter in it and can be tested on its own.
  restmail_api:
    path: packages/restmail_api

  # An in-memory rest-mail, for tests and for running the app with no server
  # (see lib/sample_mode.dart). A normal dependency because main.dart can pick
  # it; profile and release builds compile it out.
  restmail_fake:
    path: packages/restmail_fake

  # dart-lang, BSD-3. Handed a dart:io client so TLS trust is ours to set.
  http: ^1.6.0

  # Renders message HTML as Flutter widgets: no web engine, so no JavaScript
  # or CSS surface at all, and the body scrolls with the rest of the page.
  # MIT, pure Dart. It only ever sees HTML that lib/util/html_sanitizer.dart
  # has already cut down to the webmail's allowlist.
  flutter_widget_from_html_core: ^0.17.4

  # dart-lang, BSD-3. Parses message HTML for the sanitizer.
  html: ^0.15.7

  # The Keychain on iOS and the Keystore on Android, holding the session.
  # BSD-3. PINNED BELOW 11: 11.x's Android module sets compileSdk 37, while
  # this app builds with Flutter's default AGP, whose ceiling is 36.
  flutter_secure_storage: ">=10.3.1 <11.0.0"

  # Links in messages, and mailto: links. BSD-3.
  url_launcher: ^6.3.2

  # Opening an attachment hands it to the system share sheet. BSD-3.
  share_plus: ^13.3.0
  path_provider: ^2.1.6

  intl: ^0.20.2
  # Scans the setup QR code a new server prints to its log. BSD-3. Apple's
  # Vision framework on iOS, so no ML Kit there; ML Kit on Android.
  mobile_scanner: ^7.4.2
  # Opens the app from rest-mail://setup?… sign-in links. Apache-2.0.
  app_links: ^7.2.2
  # IMAP (with IDLE), SMTP and MIME for Gmail and other mail accounts. Pure
  # Dart. MPL-2.0, which applies file by file: the files we change stay
  # MPL-2.0 and public in our fork, and the app stays MIT. The fork is
  # 2.1.7 with STATUS read for Outlook's unquoted INBOX, which otherwise
  # left every Hotmail folder count at 0. Upstream fixed it in #290; back to
  # pub.dev once a release after 2.1.7 carries it.
  enough_mail:
    git:
      url: https://github.com/rest-mail/enough_mail.git
      ref: c26ccd6404540c99e626c1ffeb7aa1ef433d84cb
  # Reads the autoconfig files that say where a domain's IMAP and SMTP
  # servers are. MIT.
  xml: ^6.6.1
  # Decodes ICO favicons, which Flutter cannot, into PNG once. MIT.
  image: ^4.12.0
  # Sign in with Microsoft or Google: shows the provider's page in the
  # system browser (ASWebAuthenticationSession on iOS, a Custom Tab on
  # Android) and hands back the URL it returns to. MIT; its Android side is
  # androidx.browser, Apache-2.0. Only the browser: PKCE, the state check
  # and the tokens are done in lib/imap/oauth.dart, where tests reach them.
  flutter_web_auth_2: ^5.1.0
  # dart-lang, BSD-3. SHA-256 for the PKCE challenge.
  crypto: ^3.0.7
  flutter_svg: ^2.3.0
  # The Flutter team, BSD-3. Picks an account's custom icon from the photo
  # library. The icon stays on the phone; the server has no avatar endpoint.
  image_picker: ^1.2.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    # The brand mark, taken whole from rest-mail-server/brand/icon; not redrawn.
    - assets/brand/

  # Public Sans, the design's typeface, bundled rather than fetched so the app
  # makes no request to a font CDN. SIL Open Font License; see
  # assets/fonts/OFL.txt.
  fonts:
    - family: PublicSans
      fonts:
        - asset: assets/fonts/PublicSans-Regular.ttf
        - asset: assets/fonts/PublicSans-Italic.ttf
          style: italic
        - asset: assets/fonts/PublicSans-Medium.ttf
          weight: 500
        - asset: assets/fonts/PublicSans-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/PublicSans-Bold.ttf
          weight: 700
        - asset: assets/fonts/PublicSans-ExtraBold.ttf
          weight: 800
